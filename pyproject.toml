[build-system]
requires = ["hatchling==1.32.0", "editables==0.6"]
build-backend = "hatchling.build"

[project]
name = "alberta-framework"
version = "0.29.0"
description = "ASI: evidence-driven JAX research for end-to-end continual learning"
readme = "README.md"
license = "Apache-2.0"
# Python 3.12 supports the package's PEP 695 syntax and the robot track's
# in-process continual-RL imports. JAX 0.7.1 is the tested floor compatible
# with the NumPy 1.26 minimum.
requires-python = ">=3.12"
authors = [
    { name = "J. Klawson", email = "j-klawson@users.noreply.github.com" }
]
keywords = ["machine-learning", "continual-learning", "meta-learning", "jax", "reinforcement-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.7.1",
    "jaxlib>=0.7.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "chex>=0.1.86",
    "jaxtyping>=0.2.28",
    "orbax-checkpoint>=0.11",
]

[project.optional-dependencies]
dev = [
    "editables==0.6",
    "hatchling==1.32.0",
    "uv==0.9.24",
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff",
    "mypy",
    "twine>=5.1",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
    "joblib>=1.3",
    "tqdm>=4.66",
]
research = [
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
    "joblib>=1.3",
    "tqdm>=4.66",
]
gymnasium = [
    "gymnasium>=0.29.0",
]
forager = [
    "continual-foragax==0.55.0",
    "gymnax==0.0.9",
]
gpu = [
    "jax[cuda12]>=0.7.1",
]

[project.urls]
Homepage = "https://github.com/SlopDotCash/asi"
Repository = "https://github.com/SlopDotCash/asi"
Issues = "https://github.com/SlopDotCash/asi/issues"
Upstream = "https://github.com/lalalune/alberta"

[project.scripts]
asi-action-conditioned-latent = "alberta_framework.benchmarks.action_conditioned_latent:main"
asi-ipmnist-campaign = "alberta_framework.benchmarks.ipmnist_campaign_tools:main"
asi-ipmnist-ceiling = "alberta_framework.benchmarks.ipmnist_ceiling:main"
asi-new-directions-audit = "alberta_framework.benchmarks.new_directions_v5_v6_audit:main"
asi-rule-discovery-summary = "alberta_framework.benchmarks.rule_discovery_summary:main"
asi-jepa-transfer-feasibility = "alberta_framework.benchmarks.jepa_transfer_feasibility:main"
asi-reference-life-scorecard = "alberta_framework.benchmarks.reference_life_scorecard:main"
asi-l2er-matched-development = "alberta_framework.benchmarks.l2er_matched_development:main"
asi-native-supervised-catalog = "alberta_framework.benchmarks.native_supervised_suite:main"
asi-plasticity-diagnostic = "alberta_framework.benchmarks.plasticity_diagnostics:main"
asi-nap-ipmnist = "alberta_framework.benchmarks.nap_ipmnist:main"
asi-adamo-diagnostic = "alberta_framework.benchmarks.adamo_diagnostic:main"
asi-intentional-updates-matched-development = "alberta_framework.benchmarks.intentional_updates_control:main"
asi-activation-feature-ipmnist = "alberta_framework.benchmarks.activation_feature_ipmnist:main"
asi-coom-qualification-smoke = "alberta_framework.benchmarks.coom_qualification:main"
asi-clear-qualification = "alberta_framework.benchmarks.clear_qualification:main"
asi-cora-catalog = "alberta_framework.benchmarks.cora_development:main"
asi-forager-rerun-preflight = "alberta_framework.benchmarks.forager_scientific_rerun_preflight:main"
asi-telapa-qualification-smoke = "alberta_framework.benchmarks.telapa_qualification:main"
alberta-step1-smoke = "alberta_framework.cli:step1_smoke_main"
alberta-step2-smoke = "alberta_framework.cli:step2_smoke_main"
alberta-evidence-status = "alberta_framework.evaluation.evidence_manifest_cli:main"
alberta-forager-benchmark = "alberta_framework.console_entrypoints:forager_benchmark_main"
alberta-historical-forager = "alberta_framework.console_entrypoints:historical_forager_main"
alberta-foragax-oci = "alberta_framework.console_entrypoints:official_foragax_oci_main"
alberta-foragax-open-screen = "alberta_framework.benchmarks.foragax_open_screen:main"
alberta-forager-matched-campaign = "alberta_framework.benchmarks.forager_matched_campaign:main"
alberta-forager-matched-qualification = "alberta_framework.benchmarks.forager_matched_qualification:main"
alberta-forager-matched-sealed-evaluation = "alberta_framework.benchmarks.forager_matched_sealed_evaluation_campaign:main"
alberta-ia-evidence = "alberta_framework.evaluation.continual_ia_cli:main"
alberta-multiagent-evidence = "alberta_framework.evaluation.continual_multiagent_cli:main"
alberta-ftl-evidence = "alberta_framework.evaluation.ftl_decision_cli:main"
alberta-recurring-feature-evidence = "alberta_framework.evaluation.recurring_feature_cli:main"
alberta-scale-robust-evidence = "alberta_framework.evaluation.scale_robust_feature_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["alberta_framework"]

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/LICENSE",
    "/README.md",
    "/FORAGER_BENCHMARK.md",
    "/VENDORING.md",
    "/docs",
    "/pyproject.toml",
    "/alberta_framework",
]
exclude = [
    "**/__pycache__",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "dist",
    "outputs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# F722: Syntax error in forward annotation - ruff doesn't understand jaxtyping shape annotations
ignore = ["F722"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
strict = true
files = ["alberta_framework"]

[[tool.mypy.overrides]]
module = "gymnasium.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "foragax.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "joblib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tqdm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "chex.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jaxtyping.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "orbax.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "alberta_framework.benchmarks._foragax_open_screen_probe"
disable_error_code = ["import-not-found", "unused-ignore"]

# chex dataclasses don't have full mypy support - disable strict checks for core modules
[[tool.mypy.overrides]]
module = "alberta_framework.core.types"
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
module = "alberta_framework.core.normalizers"
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
module = "alberta_framework.core.optimizers"
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
module = "alberta_framework.core.learners"
disable_error_code = ["call-arg", "arg-type", "union-attr"]

[[tool.mypy.overrides]]
module = "alberta_framework.core.multi_head_learner"
disable_error_code = ["call-arg", "arg-type", "union-attr"]

[[tool.mypy.overrides]]
module = "alberta_framework.core.horde"
disable_error_code = ["call-arg", "return-value", "unused-ignore"]

[[tool.mypy.overrides]]
module = "alberta_framework.core.independent_demon_horde"
disable_error_code = ["call-arg", "unused-ignore"]

[[tool.mypy.overrides]]
module = "alberta_framework.core.feature_discovery"
disable_error_code = ["call-arg", "no-any-return"]

[[tool.mypy.overrides]]
module = "alberta_framework.core.interaction_features"
disable_error_code = ["call-arg", "misc", "no-any-return", "return-value"]

[[tool.mypy.overrides]]
module = "alberta_framework.core.compositional_features"
disable_error_code = ["call-arg", "no-any-return", "return-value"]

[[tool.mypy.overrides]]
module = "alberta_framework.core.continual_backprop"
disable_error_code = ["arg-type", "call-arg", "no-any-return", "unused-ignore"]

[[tool.mypy.overrides]]
module = "alberta_framework.core.options"
disable_error_code = ["call-arg", "no-any-return"]

[[tool.mypy.overrides]]
module = "alberta_framework.core.associative_memory"
disable_error_code = ["call-arg", "unused-ignore"]

[[tool.mypy.overrides]]
module = "alberta_framework.pipeline"
disable_error_code = ["arg-type", "union-attr"]

[[tool.mypy.overrides]]
module = "alberta_framework.streams.synthetic"
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
module = "alberta_framework.streams.alberta_plan_step1"
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
module = "alberta_framework.streams.feature_discovery"
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
module = "alberta_framework.streams.out_of_class"
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
module = "alberta_framework.streams.pavlovian"
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
module = "alberta_framework.streams.partial_observation"
disable_error_code = ["call-arg", "unused-ignore"]

[[tool.mypy.overrides]]
module = "alberta_framework.streams.gymnasium"
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
module = "alberta_framework.core.prototype_agent"
disable_error_code = ["attr-defined", "call-arg", "no-any-return", "union-attr", "arg-type"]

[[tool.mypy.overrides]]
module = "alberta_framework.core.oak"
disable_error_code = ["call-arg", "no-any-return"]

[[tool.mypy.overrides]]
module = "alberta_framework.core.intelligence_amplification"
disable_error_code = ["call-arg", "no-any-return"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = [
    "unit: fast isolated behavior or contract tests; never scientific evidence",
    "integration: tests spanning components, persistence, or process/CLI boundaries",
    "scientific: frozen promoted-evidence protocols; may be expensive and require preregistered seeds",
    "slow: wall-clock heavy modules (>~30s serial); excluded from the fast per-PR CI lane",
    "package: built-distribution and installed-entry-point contracts; run in the package lane",
]
