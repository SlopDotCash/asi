# Claude PR triage — automated evaluation of open pull requests.
#
# Flow:
#   1. Fetch PR metadata and derive a commit-bound diff (PR code is NEVER checked
#      out or executed; the diff is treated as untrusted data).
#   2. Claude classifies the PR: malicious / auto_merge / needs_research.
#   3. Deterministic bash steps act on the verdict:
#        malicious      -> close the PR, label it, block the author (needs
#                          PR_TRIAGE_ADMIN_TOKEN org-owner PAT; otherwise
#                          labels + warns for a human to ban).
#        auto_merge     -> squash-merge, but only if no protected path is
#                          touched, the reviewed base still matches, and CI
#                          passed for the reviewed head.
#        needs_research -> a second, deeper Claude pass researches the
#                          implementation against the base checkout, posts a
#                          review comment, then either merges (same hard
#                          gates) or labels needs-human-review.
#
# Hard guardrails enforced OUTSIDE the model:
#   - PR head code is never checked out, built, or run.
#   - Auto-merge is refused for changes to workflow, agent and Git config,
#     pinned evidence, and other protected paths listed in the path gate.
#   - GitHub atomically matches the reviewed head. The base ref and named
#     branch tip are checked immediately before the direct merge.
#   - A missing or unparseable verdict fails safe to needs-human-review.
#
# Required secrets:
#   CLAUDE_CODE_OAUTH_TOKEN (required) subscription OAuth token for the
#                           Claude steps — generate locally with
#                           `claude setup-token` (Pro/Max subscription).
#   PR_TRIAGE_ADMIN_TOKEN   (optional) org-owner PAT with admin:org, used
#                           only to block the author of a malicious PR.

name: Claude PR triage

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to triage"
        required: true

concurrency:
  group: claude-triage-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions: {}

jobs:
  triage:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write  # claude-code-action exchanges OIDC for its app token
      actions: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      WORKDIR: /tmp/pr-triage
    steps:
      - name: Check out base branch (never PR code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Ensure triage labels exist
        run: |
          gh label create flagged-malicious    --repo "$REPO" --color B60205 --description "Claude triage: flagged as malicious" || true
          gh label create needs-human-review   --repo "$REPO" --color FBCA04 --description "Claude triage: controversial, needs a human" || true

      - name: Fetch PR data (as data, not code)
        id: review_data
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Expected a positive PR number"
            exit 1
          fi
          mkdir -p "$WORKDIR"
          # One transient GitHub API 5xx (observed 2026-10-12: a graphql 504)
          # failed this step, the whole triage job, and left a healthy PR
          # with a failing check until a manual re-trigger. Retry each fetch
          # a bounded number of times with linear backoff before failing.
          fetch_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              echo "warning: attempt $attempt/3 failed: $*" >&2
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
            done
            echo "error: all 3 attempts failed: $*" >&2
            return 1
          }
          fetch_with_retry gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json number,title,body,author,baseRefName,headRefName,headRefOid,isDraft,additions,deletions,mergeable,labels \
            > "$WORKDIR/metadata.json"
          REVIEWED_HEAD=$(jq -er '.headRefOid | select(type == "string" and length == 40 and test("^[0-9a-f]{40}$"))' "$WORKDIR/metadata.json")
          BASE_BRANCH=$(jq -er '.baseRefName' "$WORKDIR/metadata.json")
          if [ "$BASE_BRANCH" != "$DEFAULT_BRANCH" ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label needs-human-review
            echo "::error::Automated review requires the default branch as its base"
            exit 1
          fi
          # Fetch the exact object without checking out the PR. Both the path
          # gate and the model receive data from the same immutable diff.
          fetch_with_retry git fetch --no-tags origin "$REVIEWED_HEAD"
          BASE_SHA=$(git rev-parse HEAD)
          git diff --no-ext-diff --no-textconv --no-renames --name-only -z \
            "$BASE_SHA...$REVIEWED_HEAD" > "$WORKDIR/changed_files.z"
          PROTECTED=false
          while IFS= read -r -d '' changed_file; do
            if [[ "$changed_file" == *$'\n'* || "$changed_file" == *$'\r'* ]]; then
              echo "::error::Unexpected newline in a changed path"
              exit 1
            fi
            case "$changed_file" in
              .github|.github/*|outputs|outputs/*|.claude|.claude/*|.husky|.husky/*|\
              .mcp.json|.claude.json|.gitmodules|.gitattributes|.ripgreprc|\
              CLAUDE.md|CLAUDE.local.md|AGENTS.md|VENDORING.md|pyproject.toml|\
              alberta_framework/evaluation/evidence_manifest.py)
                PROTECTED=true ;;
            esac
            printf '%s\n' "$changed_file"
          done < "$WORKDIR/changed_files.z" > "$WORKDIR/changed_files.txt"
          git diff --no-ext-diff --no-textconv --no-renames \
            "$BASE_SHA...$REVIEWED_HEAD" > "$WORKDIR/diff.patch"
          if [ "$(wc -c < "$WORKDIR/diff.patch")" -gt 400000 ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label needs-human-review
            echo "::error::Diff exceeds the automated review size limit"
            exit 1
          fi
          CURRENT_HEAD=$(fetch_with_retry gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          if [ "$CURRENT_HEAD" != "$REVIEWED_HEAD" ]; then
            echo "::error::PR head changed during data fetch"
            exit 1
          fi
          # Only this step can set these outputs. The review action can write
          # its reports, so its copies of the metadata and paths are untrusted.
          {
            echo "reviewed_head=$REVIEWED_HEAD"
            echo "reviewed_base_ref=$BASE_BRANCH"
            echo "reviewed_base_sha=$BASE_SHA"
            echo "protected=$PROTECTED"
            echo "author=$(jq -r '.author.login' "$WORKDIR/metadata.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Claude triage classification
        id: claude_triage
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read the instructions in .github/claude/triage-prompt.md and follow
            them exactly. The PR under review is number ${{ env.PR_NUMBER }};
            its metadata, changed-file list, and diff are in /tmp/pr-triage/.
            Write your verdict to /tmp/pr-triage/verdict.json.
          claude_args: |
            --tools "Read,Grep,Glob,Write"
            --allowedTools "Read,Grep,Glob,Write"
            --max-turns 30

      - name: Parse verdict
        id: verdict
        env:
          TRIAGE_OUTCOME: ${{ steps.claude_triage.outcome }}
          # actionlint's bundled metadata for v1 predates its conclusion output.
          TRIAGE_CONCLUSION: ${{ fromJSON(toJSON(steps.claude_triage.outputs)).conclusion }}
        run: |
          VERDICT="needs_research"
          if [ "$TRIAGE_OUTCOME" = success ] && [ "$TRIAGE_CONCLUSION" = success ] \
            && V=$(jq -er 'select(type == "object") | .verdict | strings' "$WORKDIR/verdict.json" 2>/dev/null); then
            case "$V" in
              malicious|auto_merge|needs_research) VERDICT="$V" ;;
            esac
          else
            echo "::warning::Triage did not complete with a valid verdict; requesting research"
          fi
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "Triage verdict: $VERDICT"

      # ---------------------------------------------------------- malicious
      - name: Close malicious PR and block author
        if: steps.verdict.outputs.verdict == 'malicious'
        env:
          ADMIN_TOKEN: ${{ secrets.PR_TRIAGE_ADMIN_TOKEN }}
          AUTHOR: ${{ steps.review_data.outputs.author }}
        run: |
          REASON=$(jq -r '.reasons // "Automated review flagged this pull request as malicious."' "$WORKDIR/verdict.json" 2>/dev/null || echo "Automated review flagged this pull request as malicious.")
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label flagged-malicious || true
          gh pr close "$PR_NUMBER" --repo "$REPO" --comment \
            "This pull request was closed by automated review, which flagged it as malicious. Summary of concern: $REASON — If you believe this is a mistake, contact the maintainers."
          ORG="${REPO%%/*}"
          if [ -n "$ADMIN_TOKEN" ]; then
            GH_TOKEN="$ADMIN_TOKEN" gh api -X PUT "/orgs/$ORG/blocks/$AUTHOR" \
              && echo "Blocked $AUTHOR from $ORG" \
              || echo "::warning::Failed to block $AUTHOR (token lacks admin:org?)"
          else
            echo "::warning::PR_TRIAGE_ADMIN_TOKEN not set; cannot block $AUTHOR. PR closed and labeled flagged-malicious — block the user manually."
          fi

      # --------------------------------------------------------- auto merge
      - name: Downgrade blocked auto-merge to human review
        if: steps.verdict.outputs.verdict == 'auto_merge' && steps.review_data.outputs.protected == 'true'
        run: |
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label needs-human-review
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
            "Automated review judged this PR correct, but it touches protected paths (workflows, pinned evidence outputs, or packaging), which are never auto-merged. Leaving for a maintainer."

      # ----------------------------------------------------------- research
      - name: Claude research review
        id: claude_research
        if: steps.verdict.outputs.verdict == 'needs_research'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read the instructions in .github/claude/research-prompt.md and
            follow them exactly. The PR under review is number
            ${{ env.PR_NUMBER }}; its metadata, changed-file list, and diff are
            in /tmp/pr-triage/. The repository checkout in the working
            directory is the BASE branch (the PR is not applied). Write
            /tmp/pr-triage/review.md and /tmp/pr-triage/research_verdict.json.
          claude_args: |
            --tools "Read,Grep,Glob,Write"
            --allowedTools "Read,Grep,Glob,Write"
            --max-turns 60

      - name: Post review and parse research verdict
        id: research_verdict
        if: steps.verdict.outputs.verdict == 'needs_research'
        env:
          PROTECTED_PATHS: ${{ steps.review_data.outputs.protected }}
          RESEARCH_OUTCOME: ${{ steps.claude_research.outcome }}
          RESEARCH_CONCLUSION: ${{ fromJSON(toJSON(steps.claude_research.outputs)).conclusion }}
        run: |
          if [ "$RESEARCH_OUTCOME" != success ] || [ "$RESEARCH_CONCLUSION" != success ] \
            || [ ! -s "$WORKDIR/review.md" ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label needs-human-review
            echo "::error::No completed automated research review"
            exit 1
          fi

          FINAL="manual_review"
          if V=$(jq -er 'select(type == "object") | .verdict | strings' "$WORKDIR/research_verdict.json" 2>/dev/null); then
            case "$V" in merge|manual_review) FINAL="$V" ;; esac
          fi
          gh pr review "$PR_NUMBER" --repo "$REPO" --comment --body-file "$WORKDIR/review.md"
          if [ "$FINAL" != merge ] || [ "$PROTECTED_PATHS" != false ]; then
            FINAL="manual_review"
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label needs-human-review
          fi
          echo "verdict=$FINAL" >> "$GITHUB_OUTPUT"

      - name: Merge the reviewed PR
        if: >-
          steps.review_data.outputs.protected == 'false' &&
          (steps.verdict.outputs.verdict == 'auto_merge' ||
           steps.research_verdict.outputs.verdict == 'merge')
        env:
          REVIEWED_HEAD: ${{ steps.review_data.outputs.reviewed_head }}
          REVIEWED_BASE_REF: ${{ steps.review_data.outputs.reviewed_base_ref }}
          REVIEWED_BASE_SHA: ${{ steps.review_data.outputs.reviewed_base_sha }}
        run: |
          REVIEWED_HEAD=${REVIEWED_HEAD:?Missing reviewed PR head}
          REVIEWED_BASE_REF=${REVIEWED_BASE_REF:?Missing reviewed base ref}
          REVIEWED_BASE_SHA=${REVIEWED_BASE_SHA:?Missing reviewed base SHA}
          manual_review() {
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label needs-human-review
            echo "::warning::$1"
            exit 0
          }

          CHECKS="repos/$REPO/commits/$REVIEWED_HEAD/check-runs"
          if ! CHECK_RUNS=$(gh api "$CHECKS?check_name=ci-ok&filter=latest&per_page=100") \
            || ! jq -e --arg head "$REVIEWED_HEAD" '
              [.check_runs[] | select(
                .name == "ci-ok" and .head_sha == $head and .app.slug == "github-actions"
              )] | max_by(.id) | .status == "completed" and .conclusion == "success"
            ' <<< "$CHECK_RUNS" >/dev/null; then
            manual_review "No successful GitHub Actions ci-ok check for the reviewed head"
          fi

          # The PR endpoint's base.sha may be stale. Query the named branch
          # for its current tip, immediately before the direct merge.
          BASE_PATH=$(jq -rn --arg branch "$REVIEWED_BASE_REF" '$branch | @uri')
          if ! CURRENT_BASE=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.base.ref') \
            || [ "$CURRENT_BASE" != "$REVIEWED_BASE_REF" ]; then
            manual_review "PR base branch changed or could not be confirmed"
          fi
          if ! CURRENT_BASE_SHA=$(gh api "repos/$REPO/branches/$BASE_PATH" --jq '.commit.sha') \
            || [ "$CURRENT_BASE_SHA" != "$REVIEWED_BASE_SHA" ]; then
            manual_review "Reviewed base tip changed or could not be confirmed"
          fi

          # GitHub atomically compares the head SHA. It does not accept an
          # expected base SHA, so the base check above is a preflight.
          if ! MERGED=$(gh api --method PUT "repos/$REPO/pulls/$PR_NUMBER/merge" \
            -f sha="$REVIEWED_HEAD" -f merge_method=squash --jq '.merged') \
            || [ "$MERGED" != true ]; then
            manual_review "Merge blocked or head changed"
          fi
