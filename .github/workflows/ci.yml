---
name: ci

# Benchmarks never execute in CI. The runtime lane collects only tests selected
# by `not slow and not package`, balances their files by collected-node count,
# and caps xdist at two workers so JAX compilation remains inside hosted-runner
# memory limits. Twenty-four partitions keep the growing suite and file-level
# runtime skew inside the repository's five-minute hosted-runner envelope;
# collected-node count alone underestimates several integration-heavy files.
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: >-
    ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SHARD_COUNT: "24"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up locked Python 3.12
        uses: ./.github/actions/setup-locked-python
        with:
          python-version: "3.12"
          extras: --extra dev

      - name: Build wheel and source distribution
        run: |
          uv run --no-sync uv build \
            --no-build-isolation \
            --no-build-logs \
            --no-create-gitignore \
            --out-dir "$RUNNER_TEMP/package-preflight" \
            .

      - name: Validate distribution metadata
        run: uv run --no-sync twine check "$RUNNER_TEMP"/package-preflight/*

      - name: Exercise the wheel and sdist contract
        env:
          ALBERTA_PREBUILT_DIST_DIR: ${{ runner.temp }}/package-preflight
        run: |
          uv run --no-sync python -m pytest \
            tests/test_historical_forager_cli_package.py \
            -m package \
            -q \
            -o addopts="" \
            --strict-config \
            --strict-markers

  robot-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the robot compatibility floor
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())
          excluded = {"jax", "jaxlib", "numpy"}
          retained = []
          seen = set()
          for requirement in project["project"]["dependencies"]:
              match = re.match(r"[A-Za-z0-9_.-]+", requirement)
              if match is None:
                  raise SystemExit(f"unparseable requirement: {requirement}")
              name = match.group(0).lower().replace("_", "-")
              if name in excluded:
                  seen.add(name)
              else:
                  retained.append(requirement)
          if seen != excluded:
              missing = excluded - seen
              raise SystemExit(f"missing compatibility requirements: {missing}")
          destination = (
              Path(os.environ["RUNNER_TEMP"]) / "floor-requirements.txt"
          )
          destination.write_text("\n".join(retained) + "\n", encoding="utf-8")
          PY
          python -m venv "$RUNNER_TEMP/robot-floor"
          floor_python="$RUNNER_TEMP/robot-floor/bin/python"
          "$floor_python" -m pip install --upgrade pip
          "$floor_python" -m pip install \
            --requirement "$RUNNER_TEMP/floor-requirements.txt" \
            'jax==0.7.1' \
            'jaxlib==0.7.1' \
            'numpy==1.26.0' \
            'pytest>=8.0'
          "$floor_python" -m pip check

      - name: Eager-import the root and robot surfaces
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          "$RUNNER_TEMP/robot-floor/bin/python" - <<'PY'
          import importlib

          import jax
          import jaxlib
          import numpy

          import alberta_framework

          robot_modules = (
              "alberta_framework.core.actor_critic",
              "alberta_framework.core.continual_backprop",
              "alberta_framework.core.initializers",
              "alberta_framework.core.normalizers",
              "alberta_framework.core.optimizers",
              "alberta_framework.core.sarsa",
          )
          for module_name in robot_modules:
              module = importlib.import_module(module_name)
              assert module.__name__ == module_name

          root_symbols = (
              "ActorCriticAgent",
              "ContinualBackpropConfig",
              "IDBD",
              "Normalizer",
              "SARSAAgent",
              "sparse_init",
          )
          for symbol in root_symbols:
              assert getattr(alberta_framework, symbol) is not None

          assert jax.__version__ == "0.7.1"
          assert jaxlib.__version__ == "0.7.1"
          assert numpy.__version__ == "1.26.0"
          PY

      - name: Exercise robot-floor runtime behavior
        run: |
          initializer_node="tests/test_initializers.py::"
          initializer_node+="TestSparseInit::test_correct_output_shape"
          chex_node="tests/test_initializers.py::"
          chex_node+="TestSparseInit::test_correct_sparsity_fraction"
          optimizer_node="tests/test_optimizer_registry.py::"
          optimizer_node+="test_round_trip_with_default_args[IDBD]"
          sarsa_node="tests/test_sarsa.py::"
          sarsa_node+="TestSARSAConfigSerialization::test_agent_config_roundtrip"
          actor_node="tests/test_actor_critic.py::"
          actor_node+="test_actor_critic_update_is_jittable"
          "$RUNNER_TEMP/robot-floor/bin/python" -m pytest \
            "$initializer_node" \
            "$chex_node" \
            "$optimizer_node" \
            "$sarsa_node" \
            "$actor_node" \
            -q \
            -o addopts="" \
            --strict-config \
            --strict-markers

  portability:
    name: portability ${{ matrix.os }} py3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up locked Python 3.12
        uses: ./.github/actions/setup-locked-python
        with:
          python-version: "3.12"
          extras: --extra dev

      - name: Verify the portable JAX runtime
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import platform

          import jax
          import jax.numpy as jnp

          @jax.jit
          def update(weights, features):
              prediction = jnp.dot(weights, features)
              return weights + jnp.float32(0.1) * (jnp.float32(1.0) - prediction) * features

          devices = jax.devices()
          if jax.default_backend() != "cpu":
              raise SystemExit(f"portable lane expected CPU JAX, got {jax.default_backend()}")
          if not devices or any(device.platform != "cpu" for device in devices):
              raise SystemExit(f"portable lane found unexpected JAX devices: {devices}")
          result = update(jnp.zeros((3,), dtype=jnp.float32), jnp.ones((3,), dtype=jnp.float32))
          if result.dtype != jnp.float32 or not bool(jnp.all(jnp.isfinite(result))):
              raise SystemExit("portable JIT update did not produce finite float32 state")
          print(platform.platform())
          print(jax.__version__, devices)
          PY

      - name: Run cross-platform regression panel
        shell: bash
        run: |
          uv run --no-sync python -m pytest \
            tests/test_out_of_class_streams.py::TestFrequencyMismatchStream::test_frequency_bounds_narrow_the_original_real_once \
            tests/test_out_of_class_streams.py::TestCompositionalStream::test_weight_scale_narrows_the_original_real_once \
            tests/test_step11_production.py::test_step11_oak_validates_original_real_domain_before_narrowing \
            tests/test_step11_production.py::test_step11_oak_narrows_the_original_real_once \
            tests/test_step12_production.py::test_step12_narrows_original_real_directly_without_double_rounding \
            tests/test_actor_critic.py::test_actor_critic_update_is_jittable \
            tests/test_action_conditioned_world_model.py::test_action_conditioned_world_model_update_and_prediction_shapes \
            tests/test_actual_int_types_closure.py \
            -q \
            -o addopts="" \
            --strict-config \
            --strict-markers

      - name: Run installed model and benchmark smoke commands
        shell: bash
        run: |
          uv run --no-sync alberta-step1-smoke --steps 16 --final-window 8 --seed 0
          uv run --no-sync alberta-step2-smoke --steps 16 --final-window 8 --seed 0
          uv run --no-sync asi-reference-life-scorecard --help
          uv run --no-sync python - <<'PY'
          from alberta_framework.benchmarks.reference_life_scorecard import (
              build_development_plan,
              iter_run_specs,
          )

          plan = build_development_plan()
          specs = iter_run_specs(plan)
          if len(specs) != 144:
              raise SystemExit(f"expected 144 canonical scorecard shards, got {len(specs)}")
          print(plan.plan_sha256, len(specs))
          PY

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up locked Python 3.12
        uses: ./.github/actions/setup-locked-python
        with:
          python-version: "3.12"
          extras: --extra dev

      - name: Ruff
        run: uv run --no-sync ruff check .

      - name: Mypy
        run: uv run --no-sync mypy

  test-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up locked Python 3.12
        uses: ./.github/actions/setup-locked-python
        with:
          python-version: "3.12"
          extras: --extra dev --extra gymnasium --extra forager

      - name: Collect selected non-slow tests
        run: |
          uv run --no-sync python -m pytest tests \
            --collect-only \
            -q \
            --disable-warnings \
            -m "not slow and not package" \
            -o addopts="" \
            --strict-config \
            --strict-markers \
            > "$RUNNER_TEMP/non-slow-nodeids.txt"

      - name: Build balanced nonempty shard matrix
        id: plan
        run: |
          uv run --no-sync python .github/scripts/plan_pytest_shards.py \
            --nodeids "$RUNNER_TEMP/non-slow-nodeids.txt" \
            --shards "$SHARD_COUNT" \
            --python-version 3.12 \
            --python-version 3.13 \
            --label "non-slow, non-package"

  test:
    name: >-
      runtime py${{ matrix.python }} shard ${{ matrix.shard }}
    needs: test-plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up locked Python ${{ matrix.python }}
        uses: ./.github/actions/setup-locked-python
        with:
          python-version: ${{ matrix.python }}
          extras: --extra dev --extra gymnasium --extra forager

      - name: Run selected non-slow tests
        env:
          JUNIT_PATH: >-
            ${{ runner.temp }}/junit-py${{ matrix.python
            }}-shard-${{ matrix.shard }}.xml
          TEST_FILES_JSON: ${{ matrix.files_json }}
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          files = json.loads(os.environ["TEST_FILES_JSON"])
          if not files:
              raise SystemExit("the test plan emitted an empty shard")
          for value in files:
              path = Path(value)
              if path.parts[0] != "tests" or not path.is_file():
                  raise SystemExit(f"invalid selected test file: {value}")

          command = [
              sys.executable,
              "-m",
              "pytest",
              *files,
              "-q",
              "-rs",
              "-o",
              "addopts=",
              "--strict-config",
              "--strict-markers",
              "-m",
              "not slow and not package",
              "-n",
              "2",
              "--dist",
              "loadfile",
              "--durations=25",
              "--durations-min=1.0",
              f"--junitxml={os.environ['JUNIT_PATH']}",
          ]
          print(
              f"running {len(files)} files; planned selected nodes: "
              "${{ matrix.node_count }}",
              flush=True,
          )
          raise SystemExit(subprocess.run(command, check=False).returncode)
          PY

      - name: Upload runtime timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: >-
            junit-runtime-py${{ matrix.python }}-shard-${{ matrix.shard }}
          path: >-
            ${{ runner.temp }}/junit-py${{ matrix.python
            }}-shard-${{ matrix.shard }}.xml
          if-no-files-found: warn
          retention-days: 14

  # Stable aggregate check for branch rulesets: the runtime matrix has
  # dynamic job names, so merge gating requires this single context instead.
  ci-ok:
    # A superseded run must terminate instead of scheduling this aggregate
    # after its dependencies were cancelled. Failures still reach the jq gate.
    if: ${{ !cancelled() }}
    needs: [package, robot-floor, portability, lint, test-plan, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every CI job succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(. == "success")'
